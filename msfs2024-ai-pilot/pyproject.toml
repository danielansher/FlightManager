[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msfs2024-ai-pilot"
version = "1.0.0"
description = "An AI Pilot for Microsoft Flight Simulator 2024: type two airports, and it flies there."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["msfs", "flight-simulator", "simconnect", "autopilot", "aviation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
]

# Intentionally empty. SimConnect is reached through ctypes, navigation data
# through sqlite3 and csv, and the control panel through http.server -- all in
# the standard library. Someone who just wants to fly should not have to build a
# virtual environment first.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aipilot = "aipilot.cli:main"

[project.urls]
Documentation = "https://github.com/danielansher/flightmanager/tree/main/msfs2024-ai-pilot/docs"

[tool.setuptools.packages.find]
include = ["aipilot*"]

[tool.setuptools.package-data]
aipilot = ["navdata/data/*.csv", "aircraft/profiles/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
